name: Validate status feed

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -m json.tool status.json > /tmp/status.json
      - run: node render-status-card.mjs
      - run: git diff --exit-code -- status.svg
